# Planetary target sites (Mars primary, Moon secondary - terrain only).
# Longitudes are planetocentric, east-positive, in -180..180.
# `provisional_metrics` are PLACEHOLDER estimates (see earth_sites.yaml header).
# A metric set to null means "not compared / no data" and lowers confidence.

sites:
  - id: jezero_crater
    body: mars
    name: {en: "Jezero Crater", ar: "فوهة Jezero"}
    lat: 18.44
    lon: 77.45
    bbox_km: 10
    resolution_m: {terrain: 463, mineralogy: 18, surface: 100}
    sources:
      terrain: [MOLA, HiRISE DTM]
      mineralogy: [CRISM]
      surface: [THEMIS, TES]
    provisional_metrics:
      slope_deg: 3
      roughness_m: 15
      relief_m: 600
      serpentine_index: 0.15
      carbonate_index: 0.45
      chloride_index: 0.02
      albedo: 0.20
      thermal_inertia: 380
    card:
      en:
        summary: "Ancient lake basin and delta explored by NASA's Perseverance rover since 2021. Orbital spectra show olivine, Mg-carbonate and serpentine on the crater floor and rim."
      ar:
        summary: "حوض بحيرة قديمة ودلتا تستكشفه عربة Perseverance التابعة لـ NASA منذ 2021. تُظهر الأطياف المدارية الأوليفين وكربونات المغنيسيوم والسربنتين في أرضية الفوهة وحافتها."

  - id: nili_fossae
    body: mars
    name: {en: "Nili Fossae", ar: "Nili Fossae"}
    lat: 21.50
    lon: 74.50
    bbox_km: 15
    resolution_m: {terrain: 463, mineralogy: 18, surface: 100}
    sources:
      terrain: [MOLA]
      mineralogy: [CRISM]
      surface: [THEMIS, TES]
    provisional_metrics:
      slope_deg: 8
      roughness_m: 40
      relief_m: 700
      serpentine_index: 0.40
      carbonate_index: 0.50
      chloride_index: 0.02
      albedo: 0.17
      thermal_inertia: 450
    card:
      en:
        summary: "Troughs west of Jezero holding the strongest serpentine and carbonate signatures on Mars - often called the best Martian counterpart to an ophiolite."
      ar:
        summary: "أخاديد غرب Jezero تحتوي أقوى بصمات السربنتين والكربونات على المريخ، وغالباً ما تُعد أقرب مقابل مريخي للأفيوليت."

  - id: terra_sirenum_chlorides
    body: mars
    name: {en: "Terra Sirenum chloride deposits", ar: "رواسب الكلوريد في Terra Sirenum"}
    lat: -30.50
    lon: -173.00
    bbox_km: 15
    resolution_m: {terrain: 463, mineralogy: 100, surface: 100}
    sources:
      terrain: [MOLA]
      mineralogy: [THEMIS, CRISM]
      surface: [THEMIS, TES]
    provisional_metrics:
      slope_deg: 1.5
      roughness_m: 6
      relief_m: 80
      serpentine_index: 0.0
      carbonate_index: 0.02
      chloride_index: 0.70
      albedo: 0.24
      thermal_inertia: 400
    card:
      en:
        summary: "Bright, flat patches in low-lying basins of the southern highlands, interpreted as chloride salts left by evaporating ponds or groundwater."
      ar:
        summary: "بقع فاتحة مسطحة في أحواض منخفضة بالمرتفعات الجنوبية، تُفسَّر على أنها أملاح كلوريد خلّفها تبخر برك أو مياه جوفية."

  - id: nili_patera_dunes
    body: mars
    name: {en: "Nili Patera dune field", ar: "حقل كثبان Nili Patera"}
    lat: 8.80
    lon: 67.30
    bbox_km: 10
    resolution_m: {terrain: 463, mineralogy: 18, surface: 100}
    sources:
      terrain: [MOLA, HiRISE DTM]
      mineralogy: [CRISM]
      surface: [THEMIS, TES]
    provisional_metrics:
      slope_deg: 2.5
      roughness_m: 10
      relief_m: 150
      serpentine_index: 0.0
      carbonate_index: 0.0
      chloride_index: 0.0
      albedo: 0.10
      thermal_inertia: 250
    card:
      en:
        summary: "Active dark basaltic dunes inside the Syrtis Major caldera; HiRISE has measured them migrating, making it a key site for Martian wind processes."
      ar:
        summary: "كثبان بازلتية داكنة نشطة داخل كالديرا Syrtis Major، رصد HiRISE حركتها، مما يجعلها موقعاً أساسياً لدراسة عمليات الرياح على المريخ."

  - id: moon_south_pole
    body: moon
    name: {en: "Lunar south pole (Shackleton rim)", ar: "القطب الجنوبي للقمر (حافة Shackleton)"}
    lat: -89.50
    lon: 130.00
    bbox_km: 10
    resolution_m: {terrain: 20, mineralogy: null, surface: null}
    sources:
      terrain: [LOLA]
      mineralogy: []
      surface: []
    provisional_metrics:
      slope_deg: 18
      roughness_m: 90
      relief_m: 1900
      serpentine_index: null
      carbonate_index: null
      chloride_index: null
      albedo: null
      thermal_inertia: null
    card:
      en:
        summary: "Crater rims and ridges near Shackleton, inside the Artemis candidate landing regions. Compared on terrain only: slopes and relief that drive landing and rover safety."
      ar:
        summary: "حواف فوهات وتلال قرب Shackleton ضمن مناطق الهبوط المرشحة لـ Artemis. تُقارن بالتضاريس فقط: الانحدار والتضاريس التي تحدد سلامة الهبوط والتنقل."
