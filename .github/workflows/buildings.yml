name: VEX Scout - building footprints (Microsoft Global ML Building Footprints)
on:
  push:
    branches: [buildings]
permissions:
  contents: write
jobs:
  buildings:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "numpy>=2.1" "pyyaml>=6.0" duckdb
      - working-directory: analysis
        run: PYTHONPATH=src python -m analog.grid_buildings
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B buildings-results
          git add -A data/processed/grid web/public/grid web/public/data
          git commit -m "VEX Scout buildings" || true
          git push -f origin buildings-results
